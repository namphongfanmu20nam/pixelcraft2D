<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>PixelCraft 2D — Thế giới mở</title>
<style>
  :root{
    --ink:#0d1017;
    --panel:#161b26;
    --panel2:#1f2635;
    --line:#2d3648;
    --text:#dfe6f2;
    --dim:#8794ab;
    --amber:#f0b429;
    --leaf:#5fa845;
    --danger:#e05252;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
    color:var(--text);font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
    touch-action:none;user-select:none}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated}
  #hud{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;font-size:12px}
  .card{background:rgba(13,16,23,.72);border:1px solid var(--line);border-radius:6px;padding:6px 8px;line-height:1.5}
  #hearts{letter-spacing:1px;font-size:13px}
  #hud .right{text-align:right;color:var(--dim)}
  #topbtns{display:flex;gap:6px;pointer-events:auto;margin-top:6px;justify-content:flex-end}
  button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;padding:7px 10px;cursor:pointer}
  button:active{background:#2b3446}
  button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  #hotbar{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom) + 92px);display:flex;gap:4px;z-index:5}
  .slot{width:44px;height:44px;background:rgba(13,16,23,.8);border:2px solid var(--line);border-radius:6px;
    position:relative;display:flex;align-items:center;justify-content:center}
  .slot.sel{border-color:var(--amber);box-shadow:0 0 0 2px rgba(240,180,41,.25)}
  .slot canvas{width:28px;height:28px}
  .slot .n{position:absolute;right:2px;bottom:0;font-size:11px;color:#fff;text-shadow:0 1px 2px #000}
  #pad{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);left:10px;display:flex;gap:10px;z-index:5}
  #jump{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 14px);right:10px;z-index:5}
  .big{width:64px;height:64px;border-radius:50%;font-size:22px;background:rgba(31,38,53,.85)}
  #panel{position:fixed;inset:0;background:rgba(5,7,11,.82);display:none;z-index:20;overflow:auto;padding:16px}
  #panel.on{display:block}
  .sheet{max-width:560px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:14px}
  .sheet h2{margin:0 0 2px;font-size:16px;font-weight:600}
  .sheet p.sub{margin:0 0 12px;color:var(--dim);font-size:12px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-bottom:14px}
  .recipe{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);
    border-radius:8px;margin-bottom:6px;background:var(--panel2)}
  .recipe .txt{flex:1;font-size:12px;line-height:1.4}
  .recipe .txt small{color:var(--dim)}
  .recipe.off{opacity:.42}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  input[type=text]{font:inherit;background:var(--ink);color:var(--text);border:1px solid var(--line);
    border-radius:6px;padding:8px;flex:1;min-width:120px}
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 160px);
    background:rgba(13,16,23,.9);border:1px solid var(--line);border-radius:6px;padding:8px 12px;
    font-size:12px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
  #toast.on{opacity:1}
  .tag{color:var(--amber)}
  .hide{display:none !important}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div>
    <div class="card"><span id="hearts"></span></div>
    <div class="card" style="margin-top:6px"><span id="stat"></span></div>
  </div>
  <div>
    <div id="topbtns">
      <button id="bInv">Túi đồ</button>
      <button id="bNet">Chơi chung</button>
      <button id="bSave">Lưu</button>
    </div>
    <div class="card right" style="margin-top:6px"><span id="netinfo">Một mình</span></div>
  </div>
</div>

<div id="hotbar"></div>
<div id="pad">
  <button class="big" id="bLeft">◀</button>
  <button class="big" id="bRight">▶</button>
</div>
<button class="big" id="jump">▲</button>

<div id="panel">
  <div class="sheet" id="sheetInv">
    <h2>Túi đồ</h2>
    <p class="sub">Chạm một ô để đưa vật phẩm xuống thanh nhanh.</p>
    <div class="grid" id="invGrid"></div>
    <h2>Chế tạo</h2>
    <p class="sub" id="craftHint"></p>
    <div id="craftList"></div>
    <div class="row" style="margin-top:12px">
      <button id="bCloseInv">Đóng</button>
      <button id="bRespawn">Về điểm hồi sinh</button>
    </div>
  </div>
  <div class="sheet hide" id="sheetNet" style="margin-top:12px">
    <h2>Chơi chung</h2>
    <p class="sub">Một người mở phòng, những người khác nhập mã phòng. Mọi người thấy chung một thế giới và thấy nhau di chuyển.</p>
    <div class="row"><button id="bHost">Mở phòng</button></div>
    <div class="row"><input type="text" id="roomIn" placeholder="Nhập mã phòng"><button id="bJoin">Vào phòng</button></div>
    <div class="row"><input type="text" id="nameIn" placeholder="Tên của bạn" maxlength="12"></div>
    <p class="sub" id="netStatus">Chưa kết nối.</p>
    <div class="row"><button id="bCloseNet">Đóng</button></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
<script>
"use strict";
/* ============================================================
   PixelCraft 2D — thế giới mở sinh ngẫu nhiên vô hạn
   ============================================================ */

const TILE = 26, WORLD_H = 160, CW = 16, SEA = 74;
const G = 46;              // trọng lực (ô/giây^2)
const REACH = 5.2;

/* ---------- Khối ---------- */
const B = {AIR:0,GRASS:1,DIRT:2,STONE:3,LOG:4,LEAVES:5,SAND:6,COAL:7,IRON:8,GOLD:9,
           DIAMOND:10,PLANK:11,TABLE:12,TORCH:13,WATER:14,SNOW:15,CACTUS:16,BEDROCK:17,
           GLASS:18,COBBLE:19,LAVA:20,FURNACE:21,BRICK:22};

// hard: thời gian đào cơ bản (giây) | tier: cấp cuốc cần để ra vật phẩm
const BLOCKS = [];
function defB(id,o){BLOCKS[id]=Object.assign({name:"?",c1:"#f0f",c2:"#909",solid:true,opaque:true,hard:1,tier:0,light:0,drop:id},o);}
defB(B.AIR,     {name:"Không khí",solid:false,opaque:false,hard:0,drop:-1});
defB(B.GRASS,   {name:"Cỏ",c1:"#4e9a3a",c2:"#6b4a2e",hard:.6,drop:B.DIRT});
defB(B.DIRT,    {name:"Đất",c1:"#7a5334",c2:"#6b4a2e",hard:.6});
defB(B.STONE,   {name:"Đá",c1:"#7d8590",c2:"#6a727c",hard:1.6,tier:1,drop:B.COBBLE});
defB(B.COBBLE,  {name:"Đá cuội",c1:"#78808b",c2:"#5f6772",hard:1.8,tier:1});
defB(B.LOG,     {name:"Gỗ",c1:"#6b4b2a",c2:"#553c21",hard:1.2});
defB(B.LEAVES,  {name:"Lá",c1:"#3f7f36",c2:"#356e2e",hard:.3,opaque:false,solid:true});
defB(B.SAND,    {name:"Cát",c1:"#d9c27e",c2:"#c3ab68",hard:.5});
defB(B.SNOW,    {name:"Tuyết",c1:"#e8eef5",c2:"#cdd8e4",hard:.5});
defB(B.COAL,    {name:"Quặng than",c1:"#7d8590",c2:"#2b2f36",hard:2.2,tier:1,drop:-2});
defB(B.IRON,    {name:"Quặng sắt",c1:"#7d8590",c2:"#c0a184",hard:2.6,tier:2,drop:-2});
defB(B.GOLD,    {name:"Quặng vàng",c1:"#7d8590",c2:"#e3c14f",hard:3,tier:3,drop:-2});
defB(B.DIAMOND, {name:"Kim cương",c1:"#7d8590",c2:"#5ce0d8",hard:4,tier:3,drop:-2});
defB(B.PLANK,   {name:"Ván gỗ",c1:"#9a6d3e",c2:"#835a31",hard:1});
defB(B.TABLE,   {name:"Bàn chế tạo",c1:"#a5763f",c2:"#5d4123",hard:1.2});
defB(B.FURNACE, {name:"Lò nung",c1:"#6f767f",c2:"#2a2d33",hard:2.2,tier:1,light:6});
defB(B.BRICK,   {name:"Gạch đá",c1:"#868d97",c2:"#6d747e",hard:1.9,tier:1});
defB(B.TORCH,   {name:"Đuốc",c1:"#e8b33c",c2:"#8a5a26",hard:.1,solid:false,opaque:false,light:14});
defB(B.WATER,   {name:"Nước",c1:"#2f6fbf",c2:"#3d84d6",hard:0,solid:false,opaque:false,drop:-1});
defB(B.LAVA,    {name:"Dung nham",c1:"#e2621f",c2:"#f59a2a",hard:0,solid:false,opaque:false,light:12,drop:-1});
defB(B.CACTUS,  {name:"Xương rồng",c1:"#3f8a4a",c2:"#2f6b39",hard:.6,opaque:false});
defB(B.GLASS,   {name:"Kính",c1:"#bfe0f0",c2:"#9fc9de",hard:.4,opaque:false});
defB(B.BEDROCK, {name:"Đá nền",c1:"#33383f",c2:"#1d2026",hard:9999,tier:9});

/* ---------- Vật phẩm ---------- */
const ITEMS = {};
function defI(id,o){ITEMS[id]=Object.assign({name:id,place:null,tier:0,dmg:1,c1:"#ccc",c2:"#888",kind:"item"},o);}
for(let i=1;i<BLOCKS.length;i++){
  const b=BLOCKS[i]; if(!b) continue;
  if(i===B.WATER||i===B.LAVA) continue;
  defI("b"+i,{name:b.name,place:i,kind:"block",c1:b.c1,c2:b.c2});
}
defI("stick",{name:"Gậy",c1:"#9a6d3e",c2:"#6b4b2a",kind:"stick"});
defI("coal",{name:"Than",c1:"#2b2f36",c2:"#43484f",kind:"round"});
defI("iron_ingot",{name:"Thỏi sắt",c1:"#d8d2c8",c2:"#a8a196",kind:"round"});
defI("gold_ingot",{name:"Thỏi vàng",c1:"#e3c14f",c2:"#b9982f",kind:"round"});
defI("diamond",{name:"Kim cương",c1:"#5ce0d8",c2:"#2fa8a2",kind:"round"});
defI("pick_wood",{name:"Cuốc gỗ",tier:1,dmg:2,c1:"#9a6d3e",c2:"#6b4b2a",kind:"pick"});
defI("pick_stone",{name:"Cuốc đá",tier:2,dmg:2,c1:"#8b939d",c2:"#6b4b2a",kind:"pick"});
defI("pick_iron",{name:"Cuốc sắt",tier:3,dmg:3,c1:"#d8d2c8",c2:"#6b4b2a",kind:"pick"});
defI("pick_diamond",{name:"Cuốc kim cương",tier:4,dmg:3,c1:"#5ce0d8",c2:"#6b4b2a",kind:"pick"});
defI("sword_wood",{name:"Kiếm gỗ",dmg:4,c1:"#9a6d3e",c2:"#6b4b2a",kind:"sword"});
defI("sword_stone",{name:"Kiếm đá",dmg:6,c1:"#8b939d",c2:"#6b4b2a",kind:"sword"});
defI("sword_iron",{name:"Kiếm sắt",dmg:8,c1:"#d8d2c8",c2:"#6b4b2a",kind:"sword"});
defI("sword_diamond",{name:"Kiếm kim cương",dmg:11,c1:"#5ce0d8",c2:"#6b4b2a",kind:"sword"});
defI("apple",{name:"Táo",c1:"#d4453f",c2:"#3f8a4a",kind:"round"});

const ORE_DROP = {[B.COAL]:"coal",[B.IRON]:"b"+B.IRON,[B.GOLD]:"b"+B.GOLD,[B.DIAMOND]:"diamond"};

/* ---------- Công thức ---------- */
const RECIPES = [
  {out:["b"+B.PLANK,4], need:{["b"+B.LOG]:1}, table:false},
  {out:["stick",4], need:{["b"+B.PLANK]:2}, table:false},
  {out:["b"+B.TABLE,1], need:{["b"+B.PLANK]:4}, table:false},
  {out:["b"+B.TORCH,4], need:{stick:1,coal:1}, table:false},
  {out:["b"+B.FURNACE,1], need:{["b"+B.COBBLE]:8}, table:true},
  {out:["pick_wood",1], need:{["b"+B.PLANK]:3,stick:2}, table:true},
  {out:["sword_wood",1], need:{["b"+B.PLANK]:2,stick:1}, table:true},
  {out:["pick_stone",1], need:{["b"+B.COBBLE]:3,stick:2}, table:true},
  {out:["sword_stone",1], need:{["b"+B.COBBLE]:2,stick:1}, table:true},
  {out:["pick_iron",1], need:{iron_ingot:3,stick:2}, table:true},
  {out:["sword_iron",1], need:{iron_ingot:2,stick:1}, table:true},
  {out:["pick_diamond",1], need:{diamond:3,stick:2}, table:true},
  {out:["sword_diamond",1], need:{diamond:2,stick:1}, table:true},
  {out:["b"+B.BRICK,4], need:{["b"+B.COBBLE]:4}, table:true},
  {out:["iron_ingot",1], need:{["b"+B.IRON]:1,coal:1}, furnace:true},
  {out:["gold_ingot",1], need:{["b"+B.GOLD]:1,coal:1}, furnace:true},
  {out:["b"+B.GLASS,2], need:{["b"+B.SAND]:2,coal:1}, furnace:true},
];

/* ---------- Nhiễu ngẫu nhiên ---------- */
let SEED = (Math.random()*1e9)|0;
function hash2(x,y,s){
  let h = Math.imul(x|0,374761393) ^ Math.imul(y|0,668265263) ^ Math.imul(s|0,1442695041);
  h = Math.imul(h ^ (h>>>13), 1274126177);
  return ((h ^ (h>>>16))>>>0)/4294967296;
}
function noise1(x,s,sc){
  const xs=x/sc, x0=Math.floor(xs), t=xs-x0, u=t*t*(3-2*t);
  const a=hash2(x0,0,s), b=hash2(x0+1,0,s);
  return a+(b-a)*u;
}
function noise2(x,y,s,sc){
  const xs=x/sc, ys=y/sc, x0=Math.floor(xs), y0=Math.floor(ys);
  const tx=xs-x0, ty=ys-y0, u=tx*tx*(3-2*tx), v=ty*ty*(3-2*ty);
  const a=hash2(x0,y0,s), b=hash2(x0+1,y0,s), c=hash2(x0,y0+1,s), d=hash2(x0+1,y0+1,s);
  return (a+(b-a)*u)*(1-v)+(c+(d-c)*u)*v;
}
function terrainHeight(x){
  let h = 62;
  h += (noise1(x,SEED,140)-0.5)*34;
  h += (noise1(x,SEED+11,46)-0.5)*13;
  h += (noise1(x,SEED+23,13)-0.5)*4;
  return Math.floor(h);
}
// 0 rừng, 1 sa mạc, 2 tuyết
function biomeAt(x){
  const n = noise1(x,SEED+77,360);
  if(n<0.32) return 1;
  if(n>0.70) return 2;
  return 0;
}

/* ---------- Thế giới ---------- */
let chunks = new Map();        // cx -> Uint8Array(CW*WORLD_H)
let edits = new Map();         // "x,y" -> id (khác với sinh gốc)
let editsByChunk = new Map();  // cx -> Map("x,y"->id)
let topCache = new Map();      // x -> y của ô chắn sáng trên cùng

function chunkOf(x){ return Math.floor(x/CW); }
function idx(lx,y){ return lx*WORLD_H + y; }

function genChunk(cx){
  const a = new Uint8Array(CW*WORLD_H);
  for(let lx=0;lx<CW;lx++){
    const gx = cx*CW+lx, h = terrainHeight(gx), bio = biomeAt(gx);
    for(let y=0;y<WORLD_H;y++){
      let v = B.AIR;
      if(y===WORLD_H-1) v = B.BEDROCK;
      else if(y<h){ v = (y>=SEA) ? B.WATER : B.AIR; }
      else if(y===h){ v = bio===1?B.SAND : bio===2?B.SNOW : (h>=SEA?B.SAND:B.GRASS); }
      else if(y<=h+4){ v = bio===1?B.SAND:B.DIRT; }
      else {
        v = B.STONE;
        if(y>h+6){
          const cave = noise2(gx, y*1.7, SEED+5, 15);
          const tun  = noise2(gx, y*3.0, SEED+6, 30);
          if(cave>0.705 || tun>0.785) v = (y>140 && hash2(gx,y,SEED+8)<0.55) ? B.LAVA : B.AIR;
        }
        if(v===B.STONE){
          if(y>h+5 && noise2(gx,y,SEED+31,3.2)>0.845) v=B.COAL;
          else if(y>78 && noise2(gx,y,SEED+32,2.8)>0.875) v=B.IRON;
          else if(y>112 && noise2(gx,y,SEED+33,2.4)>0.905) v=B.GOLD;
          else if(y>132 && noise2(gx,y,SEED+34,2.1)>0.925) v=B.DIAMOND;
        }
        if(y===WORLD_H-1) v=B.BEDROCK;
      }
      a[idx(lx,y)] = v;
    }
  }
  // cây cối (quét rộng hơn chunk để lá không bị cắt)
  for(let gx=cx*CW-4; gx<cx*CW+CW+4; gx++){
    const bio = biomeAt(gx), h = terrainHeight(gx);
    if(h>=SEA-1) continue;
    const r = hash2(gx,777,SEED);
    const put=(x,y,v,soft)=>{
      const lx=x-cx*CW; if(lx<0||lx>=CW||y<0||y>=WORLD_H) return;
      if(soft && a[idx(lx,y)]!==B.AIR) return;
      a[idx(lx,y)]=v;
    };
    if(bio===0 && r<0.085){
      const th = 4+Math.floor(hash2(gx,778,SEED)*3);
      for(let i=1;i<=th;i++) put(gx,h-i,B.LOG,false);
      const top=h-th;
      for(let dx=-2;dx<=2;dx++) for(let dy=-2;dy<=1;dy++){
        if(Math.abs(dx)===2&&dy>=1) continue;
        if(Math.abs(dx)+Math.abs(dy)>3) continue;
        put(gx+dx, top+dy, B.LEAVES, true);
      }
    } else if(bio===1 && r>0.955){
      const th = 2+Math.floor(hash2(gx,779,SEED)*2);
      for(let i=1;i<=th;i++) put(gx,h-i,B.CACTUS,false);
    } else if(bio===2 && r<0.05){
      const th = 5+Math.floor(hash2(gx,780,SEED)*3);
      for(let i=1;i<=th;i++) put(gx,h-i,B.LOG,false);
      const top=h-th;
      for(let dy=0;dy<4;dy++){
        const w=dy===0?0:(dy>=3?2:1);
        for(let dx=-w;dx<=w;dx++) put(gx+dx, top+dy-1, B.LEAVES, true);
      }
    }
  }
  const em = editsByChunk.get(cx);
  if(em) for(const [k,v] of em){
    const p=k.split(","), x=+p[0], y=+p[1];
    a[idx(x-cx*CW,y)] = v;
  }
  return a;
}
function ensureChunk(cx){
  let c = chunks.get(cx);
  if(!c){ c = genChunk(cx); chunks.set(cx,c); }
  return c;
}
function getBlock(x,y){
  if(y<0||y>=WORLD_H) return B.AIR;
  x=Math.floor(x); y=Math.floor(y);
  const cx=chunkOf(x);
  return ensureChunk(cx)[idx(x-cx*CW,y)];
}
function setBlock(x,y,v,fromNet){
  x=Math.floor(x); y=Math.floor(y);
  if(y<0||y>=WORLD_H) return;
  const cx=chunkOf(x);
  ensureChunk(cx)[idx(x-cx*CW,y)] = v;
  const k=x+","+y;
  edits.set(k,v);
  let em=editsByChunk.get(cx); if(!em){em=new Map();editsByChunk.set(cx,em);} em.set(k,v);
  topCache.delete(x);
  if(!fromNet) net.sendEdit(x,y,v);
}
function isSolid(x,y){ const b=BLOCKS[getBlock(x,y)]; return b && b.solid; }
function topAt(x){
  x=Math.floor(x);
  let t=topCache.get(x);
  if(t===undefined){
    t=WORLD_H;
    for(let y=0;y<WORLD_H;y++){ const b=BLOCKS[getBlock(x,y)]; if(b.opaque){t=y;break;} }
    topCache.set(x,t);
    if(topCache.size>4000) topCache.clear();
  }
  return t;
}

/* ---------- Người chơi ---------- */
const player = {
  x:0, y:0, vx:0, vy:0, w:.68, h:1.78, onGround:false, dir:1, hp:20,
  anim:0, hurt:0, spawnX:0, spawnY:0, atkCd:0, invul:0
};
let inv = new Array(36).fill(null); // {id,count}
let selSlot = 0;

function addItem(id,count){
  if(!ITEMS[id]) return;
  for(let i=0;i<inv.length;i++){
    const s=inv[i];
    if(s && s.id===id && s.count<99){ const add=Math.min(count,99-s.count); s.count+=add; count-=add; if(count<=0) return; }
  }
  for(let i=0;i<inv.length;i++){
    if(!inv[i]){ inv[i]={id,count:Math.min(count,99)}; count-=99; if(count<=0) return; }
  }
}
function countItem(id){ let n=0; for(const s of inv) if(s&&s.id===id) n+=s.count; return n; }
function takeItem(id,n){
  for(let i=0;i<inv.length&&n>0;i++){
    const s=inv[i]; if(!s||s.id!==id) continue;
    const t=Math.min(n,s.count); s.count-=t; n-=t; if(s.count<=0) inv[i]=null;
  }
}
function held(){ return inv[selSlot]; }
function heldTier(){ const s=held(); return s&&ITEMS[s.id]?ITEMS[s.id].tier:0; }
function heldDmg(){ const s=held(); return s&&ITEMS[s.id]?ITEMS[s.id].dmg:1; }

function spawnPlayer(){
  const x=0, h=terrainHeight(x);
  player.x=x+.5; player.y=h-2.2; player.vx=0; player.vy=0; player.hp=20;
  player.spawnX=player.x; player.spawnY=player.y;
}

/* ---------- Quái vật ---------- */
let mobs = [];
function spawnMobs(dt){
  if(mobs.length>=8) return;
  if(Math.random() > dt*0.6) return;
  const night = skyLight() < 7;
  const dist = 14+Math.random()*16;
  const mx = Math.floor(player.x + (Math.random()<.5?-dist:dist));
  if(night){
    const h = topAt(mx);
    if(h<WORLD_H-2 && getBlock(mx,h-1)===B.AIR && getBlock(mx,h-2)===B.AIR)
      mobs.push({x:mx+.5,y:h-2,vx:0,vy:0,w:.7,h:1.8,hp:14,type:"zombie",onGround:false,cd:0,anim:0});
  } else {
    const my = Math.floor(player.y + (Math.random()*30-6));
    if(my>90 && my<WORLD_H-3 && getBlock(mx,my)===B.AIR && getBlock(mx,my+1)===B.AIR && isSolid(mx,my+2))
      mobs.push({x:mx+.5,y:my,vx:0,vy:0,w:.8,h:.8,hp:8,type:"slime",onGround:false,cd:0,anim:0});
  }
}
function updateMobs(dt){
  for(let i=mobs.length-1;i>=0;i--){
    const m=mobs[i];
    const dx = player.x-m.x, dy = player.y-m.y;
    const d = Math.hypot(dx,dy);
    if(d>48 || m.hp<=0){ mobs.splice(i,1); continue; }
    m.cd=Math.max(0,m.cd-dt);
    if(m.type==="zombie" && skyLight()>11 && topAt(Math.floor(m.x))>=Math.floor(m.y)) m.hp-=dt*4;
    const spd = m.type==="zombie"?3.1:2.2;
    if(d<26){
      m.vx = Math.sign(dx)*spd;
      m.anim += dt*8;
      if(m.onGround && (isSolid(m.x+Math.sign(dx)*.6, m.y+m.h-.2) || (dy<-1.2 && Math.random()<.04))) m.vy=-13;
    } else m.vx*=0.8;
    physics(m,dt);
    if(d<1.1 && m.cd<=0 && player.invul<=0){ hurtPlayer(m.type==="zombie"?3:2); m.cd=.9; player.vx += Math.sign(-dx)*7; player.vy=-6; }
  }
}

/* ---------- Vật lý ---------- */
function physics(e,dt){
  e.vy += G*dt;
  if(e.vy>38) e.vy=38;
  // ngang
  e.x += e.vx*dt;
  let x0=Math.floor(e.x-e.w/2), x1=Math.floor(e.x+e.w/2);
  let y0=Math.floor(e.y), y1=Math.floor(e.y+e.h-0.02);
  for(let y=y0;y<=y1;y++){
    if(e.vx>0 && isSolid(x1,y)){ e.x = x1 - e.w/2 - 0.001; e.vx=0; }
    else if(e.vx<0 && isSolid(x0,y)){ e.x = x0+1 + e.w/2 + 0.001; e.vx=0; }
  }
  // dọc
  e.y += e.vy*dt;
  x0=Math.floor(e.x-e.w/2); x1=Math.floor(e.x+e.w/2);
  y0=Math.floor(e.y); y1=Math.floor(e.y+e.h-0.02);
  e.onGround=false;
  for(let x=x0;x<=x1;x++){
    if(e.vy>0 && isSolid(x,y1)){
      if(e===player && e.vy>19) hurtPlayer(Math.floor((e.vy-19)*1.2));
      e.y = y1 - e.h - 0.001; e.vy=0; e.onGround=true;
    } else if(e.vy<0 && isSolid(x,y0)){ e.y = y0+1 + 0.001; e.vy=0; }
  }
  if(e.y>WORLD_H+10){ if(e===player){ hurtPlayer(20); } else e.hp=0; }
}
function inLiquid(e){
  const b = getBlock(Math.floor(e.x), Math.floor(e.y+e.h*0.6));
  return b===B.WATER ? 1 : (b===B.LAVA ? 2 : 0);
}
function hurtPlayer(n){
  if(player.invul>0 || player.hp<=0) return;
  player.hp -= n; player.hurt=.35; player.invul=.5;
  if(player.hp<=0){ player.hp=0; toast("Bạn đã gục. Chạm \"Về điểm hồi sinh\" trong túi đồ."); }
}

/* ---------- Ánh sáng & thời gian ---------- */
let time = 0.25;                    // 0..1, 0.25 = sáng sớm
const DAY_LEN = 300;                // giây cho một ngày
function skyLight(){
  // 15 ban ngày, 4 ban đêm
  const t=time;
  let f;
  if(t<0.22) f=0.12;
  else if(t<0.30) f=(t-0.22)/0.08;
  else if(t<0.72) f=1;
  else if(t<0.82) f=1-(t-0.72)/0.10;
  else f=0.12;
  return 4 + 11*Math.max(0,Math.min(1,f));
}

/* kết cấu khối dựng sẵn */
const tex = [];
function buildTextures(){
  for(let i=1;i<BLOCKS.length;i++){
    const b=BLOCKS[i]; if(!b) continue;
    const c=document.createElement("canvas"); c.width=c.height=TILE;
    const g=c.getContext("2d");
    if(i===B.TORCH){
      g.fillStyle="#6b4b2a"; g.fillRect(TILE/2-2,TILE*0.35,4,TILE*0.6);
      g.fillStyle="#f5c542"; g.fillRect(TILE/2-3,TILE*0.22,6,7);
      g.fillStyle="#fff1b8"; g.fillRect(TILE/2-1,TILE*0.26,2,3);
    } else if(i===B.GLASS){
      g.fillStyle="rgba(191,224,240,.35)"; g.fillRect(0,0,TILE,TILE);
      g.strokeStyle="rgba(255,255,255,.55)"; g.lineWidth=2; g.strokeRect(1,1,TILE-2,TILE-2);
    } else if(i===B.LEAVES){
      g.fillStyle=b.c1; g.fillRect(0,0,TILE,TILE);
      for(let k=0;k<16;k++){
        const r=hash2(k,i,7);
        g.fillStyle = r>.5?b.c2:"rgba(255,255,255,.07)";
        g.fillRect((r*TILE)|0, (hash2(k,i,9)*TILE)|0, 4,4);
      }
    } else if(i===B.GRASS){
      g.fillStyle=b.c2; g.fillRect(0,0,TILE,TILE);
      g.fillStyle=b.c1; g.fillRect(0,0,TILE,TILE*0.32);
      for(let k=0;k<8;k++) g.fillRect((hash2(k,i,3)*TILE)|0, TILE*0.3, 3, 3+((hash2(k,i,4)*4)|0));
    } else if(i===B.CACTUS){
      g.fillStyle=b.c1; g.fillRect(3,0,TILE-6,TILE);
      g.fillStyle=b.c2; g.fillRect(3,0,3,TILE); g.fillRect(TILE-6,0,3,TILE);
    } else {
      if(i===B.WATER||i===B.LAVA) g.globalAlpha=0.78;
      g.fillStyle=b.c1; g.fillRect(0,0,TILE,TILE);
      // hạt sạn
      for(let k=0;k<14;k++){
        const r1=hash2(k,i,1), r2=hash2(k,i,2);
        g.fillStyle = k%3===0 ? "rgba(0,0,0,.14)" : "rgba(255,255,255,.07)";
        g.fillRect((r1*TILE)|0,(r2*TILE)|0,3,3);
      }
      if(ORE_DROP[i] || i===B.COAL){
        g.fillStyle=b.c2;
        for(let k=0;k<5;k++){
          const r1=hash2(k,i,21), r2=hash2(k,i,22);
          g.fillRect(3+(r1*(TILE-10))|0, 3+(r2*(TILE-10))|0, 6,6);
        }
      }
      if(i===B.BRICK){
        g.strokeStyle="rgba(0,0,0,.25)"; g.lineWidth=2;
        g.beginPath(); g.moveTo(0,TILE/2); g.lineTo(TILE,TILE/2);
        g.moveTo(TILE/2,0); g.lineTo(TILE/2,TILE/2); g.moveTo(TILE*0.2,TILE/2); g.lineTo(TILE*0.2,TILE); g.stroke();
      }
      if(i===B.TABLE){
        g.fillStyle="rgba(0,0,0,.3)"; g.fillRect(2,2,TILE-4,4); g.fillRect(2,TILE-8,TILE-4,3);
      }
      if(i===B.FURNACE){
        g.fillStyle="#1b1e23"; g.fillRect(5,TILE*0.45,TILE-10,TILE*0.4);
        g.fillStyle="#e2621f"; g.fillRect(7,TILE*0.6,TILE-14,TILE*0.2);
      }
      if(i===B.WATER||i===B.LAVA){
        g.globalAlpha=.85; g.fillStyle=b.c2; g.fillRect(0,0,TILE,4); g.globalAlpha=1;
      }
    }
    tex[i]=c;
  }
}

/* bản đồ sáng (vẽ nhỏ rồi phóng to cho mượt) */
const lightCv = document.createElement("canvas");
const lightCtx = lightCv.getContext("2d");

function computeLight(x0,y0,w,h){
  const n=w*h, qcap=n*6, L=new Uint8Array(n), q=new Int32Array(qcap*2);
  let qh=0, qt=0;
  const sky = skyLight();
  for(let i=0;i<w;i++){
    const gx=x0+i, t=topAt(gx);
    for(let j=0;j<h;j++){
      const gy=y0+j, id=getBlock(gx,gy), b=BLOCKS[id];
      let l=0;
      if(gy<t && !b.opaque) l=sky;
      if(b.light>l) l=b.light;
      if(l>0){ L[i*h+j]=l; q[qt*2]=i; q[qt*2+1]=j; qt++; }
    }
  }
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(qh<qt){
    const ci=q[qh*2], cj=q[qh*2+1]; qh++;
    const cl=L[ci*h+cj];
    if(cl<=1) continue;
    for(const d of dirs){
      const ni=ci+d[0], nj=cj+d[1];
      if(ni<0||nj<0||ni>=w||nj>=h) continue;
      const nb=BLOCKS[getBlock(x0+ni,y0+nj)];
      const cost = nb.opaque?4:1;
      const nl = cl-cost;
      if(nl>L[ni*h+nj]){
        L[ni*h+nj]=nl;
        if(qt<qcap){ q[qt*2]=ni; q[qt*2+1]=nj; qt++; }
      }
    }
  }
  return L;
}

/* ---------- Vẽ ---------- */
let camX=0, camY=0;
function drawSky(){
  const sl = skyLight()/15;
  const g = ctx.createLinearGradient(0,0,0,VH);
  const day=["#69a9e8","#a9d3f2"], night=["#070c1a","#101a33"];
  const mix=(a,b,t)=>{
    const pa=[parseInt(a.slice(1,3),16),parseInt(a.slice(3,5),16),parseInt(a.slice(5,7),16)];
    const pb=[parseInt(b.slice(1,3),16),parseInt(b.slice(3,5),16),parseInt(b.slice(5,7),16)];
    return "rgb("+pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(",")+")";
  };
  g.addColorStop(0, mix(night[0],day[0],sl));
  g.addColorStop(1, mix(night[1],day[1],sl));
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);
  if(sl<0.75){
    ctx.globalAlpha=(0.75-sl)*1.3;
    for(let i=0;i<70;i++){
      const sx=(hash2(i,1,4)*VW), sy=hash2(i,2,4)*VH*0.6;
      ctx.fillStyle="#fff"; ctx.fillRect(sx,sy,2,2);
    }
    ctx.globalAlpha=1;
  }
  // mặt trời / mặt trăng
  const ang = (time-0.25)*Math.PI*2;
  const sx = VW*0.5 + Math.cos(ang-Math.PI/2)*VW*0.55;
  const sy = VH*0.55 + Math.sin(ang-Math.PI/2)*VH*0.55;
  ctx.fillStyle = sl>0.5?"#ffe08a":"#dfe6f2";
  ctx.beginPath(); ctx.arc(sx,sy,sl>0.5?22:16,0,7); ctx.fill();
  // núi xa
  ctx.fillStyle = "rgba(20,30,45,"+(0.35+0.25*(1-sl))+")";
  ctx.beginPath(); ctx.moveTo(0,VH);
  for(let i=0;i<=VW;i+=16){
    const wx=(camX*0.25+i)/90;
    const y = VH*0.62 - noise1(wx*10,SEED+3,12)*130;
    ctx.lineTo(i,y);
  }
  ctx.lineTo(VW,VH); ctx.closePath(); ctx.fill();
}

function drawEntity(e, kind){
  const px=Math.round(e.x*TILE-camX), py=Math.round(e.y*TILE-camY);
  const w=e.w*TILE, h=e.h*TILE;
  ctx.save(); ctx.translate(px,py);
  const swing = Math.sin(e.anim||0)*4;
  if(kind==="slime"){
    ctx.fillStyle="#4fbf6a"; ctx.fillRect(-w/2,0,w,h);
    ctx.fillStyle="#0d1017"; ctx.fillRect(-w/4,h*0.35,4,4); ctx.fillRect(w/4-4,h*0.35,4,4);
  } else {
    const body = kind==="zombie" ? "#4e7a45" : "#3d6cb9";
    const skin = kind==="zombie" ? "#7fa06f" : "#e0b98c";
    ctx.fillStyle="rgba(0,0,0,.25)"; ctx.fillRect(-w/2,h-3,w,3);
    ctx.fillStyle=body; ctx.fillRect(-w/2, h*0.38, w, h*0.42);        // thân
    ctx.fillStyle="#2b3a5e"; ctx.fillRect(-w/2, h*0.78, w*0.45, h*0.22-swing*0.2); // chân
    ctx.fillRect(4-w/2+w*0.5, h*0.78, w*0.45, h*0.22+swing*0.2);
    ctx.fillStyle=skin; ctx.fillRect(-w*0.42, 0, w*0.84, h*0.36);     // đầu
    ctx.fillStyle="#0d1017";
    const dx = (e.dir||1)>0 ? 2 : -6;
    ctx.fillRect(dx, h*0.15, 4,4); ctx.fillRect(dx+ (e.dir>0?7:-7), h*0.15, 4,4);
    ctx.fillStyle=skin; ctx.fillRect((e.dir>0? w*0.3 : -w*0.5), h*0.40+swing, w*0.2, h*0.3); // tay
  }
  ctx.restore();
}

function drawHeldItem(){
  const s=held(); if(!s) return;
  const it=ITEMS[s.id];
  const px=Math.round(player.x*TILE-camX), py=Math.round(player.y*TILE-camY);
  ctx.save(); ctx.translate(px + (player.dir>0?10:-10), py+player.h*TILE*0.5);
  ctx.rotate(player.dir>0? -0.5 : 0.5);
  if(it.kind==="block"){ ctx.drawImage(tex[it.place], -7,-7, 14,14); }
  else {
    ctx.fillStyle=it.c2; ctx.fillRect(-2,-2,4,16);
    ctx.fillStyle=it.c1;
    if(it.kind==="pick") ctx.fillRect(-8,-8,16,5);
    else if(it.kind==="sword") ctx.fillRect(-2,-14,4,14);
    else ctx.fillRect(-4,-6,8,8);
  }
  ctx.restore();
}

let particles=[];
function spawnParticles(x,y,id,n){
  const b=BLOCKS[id];
  for(let i=0;i<n;i++) particles.push({x:x+.5,y:y+.5,vx:(Math.random()-.5)*6,vy:-Math.random()*6,life:.6,c:Math.random()<.5?b.c1:b.c2});
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.life-=dt; p.vy+=G*dt*0.6; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.life<=0) particles.splice(i,1);
  }
}

function render(){
  drawSky();
  const tx0 = Math.floor(camX/TILE)-1, ty0 = Math.max(0,Math.floor(camY/TILE)-1);
  const tw = Math.ceil(VW/TILE)+3, th = Math.min(WORLD_H-ty0, Math.ceil(VH/TILE)+3);

  // khối
  for(let i=0;i<tw;i++){
    const gx=tx0+i;
    for(let j=0;j<th;j++){
      const gy=ty0+j;
      const id=getBlock(gx,gy);
      if(id===B.AIR) continue;
      ctx.drawImage(tex[id], Math.round(gx*TILE-camX), Math.round(gy*TILE-camY), TILE, TILE);
    }
  }
  // tiến trình đào
  if(mining.tile && mining.prog>0){
    const p=Math.min(1,mining.prog/mining.total);
    ctx.fillStyle="rgba(0,0,0,"+(0.15+p*0.45)+")";
    ctx.fillRect(mining.tile[0]*TILE-camX, mining.tile[1]*TILE-camY, TILE,TILE);
    ctx.strokeStyle="rgba(255,255,255,.5)"; ctx.lineWidth=2;
    ctx.strokeRect(mining.tile[0]*TILE-camX+1, mining.tile[1]*TILE-camY+1, TILE-2,TILE-2);
  }
  // hạt
  for(const p of particles){
    ctx.fillStyle=p.c; ctx.fillRect(p.x*TILE-camX, p.y*TILE-camY, 4,4);
  }
  // sinh vật + người chơi khác
  for(const m of mobs) drawEntity(m, m.type);
  for(const id in net.peers){
    const p=net.peers[id];
    if(p.x===undefined) continue;
    drawEntity(p,"player");
    ctx.fillStyle="#dfe6f2"; ctx.font="12px monospace"; ctx.textAlign="center";
    ctx.fillText(p.name||"?", p.x*TILE-camX, p.y*TILE-camY-6);
    ctx.textAlign="left";
  }
  if(player.hurt>0){ ctx.globalAlpha=.6; }
  drawEntity(player,"player");
  ctx.globalAlpha=1;
  drawHeldItem();

  // ánh sáng
  const L = computeLight(tx0,ty0,tw,th);
  if(lightCv.width!==tw||lightCv.height!==th){ lightCv.width=tw; lightCv.height=th; }
  const img = lightCtx.createImageData(tw,th);
  for(let i=0;i<tw;i++) for(let j=0;j<th;j++){
    const l=L[i*th+j]/15;
    const a = Math.max(0, 1 - l*1.05);
    const o=(j*tw+i)*4;
    img.data[o]=2; img.data[o+1]=4; img.data[o+2]=10; img.data[o+3]=Math.min(255, a*242);
  }
  lightCtx.putImageData(img,0,0);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(lightCv, tx0*TILE-camX-TILE/2, ty0*TILE-camY-TILE/2, tw*TILE, th*TILE);
  ctx.imageSmoothingEnabled=false;

  if(player.hurt>0){
    ctx.fillStyle="rgba(200,40,40,"+(player.hurt*0.7)+")"; ctx.fillRect(0,0,VW,VH);
  }
  if(player.hp<=0){
    ctx.fillStyle="rgba(10,0,0,.6)"; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle="#fff"; ctx.font="bold 28px monospace"; ctx.textAlign="center";
    ctx.fillText("Bạn đã gục", VW/2, VH/2);
    ctx.textAlign="left";
  }
  // chỉ báo ô đang nhắm (chuột)
  if(pointer.wx!==null && !isTouch){
    const tx=Math.floor(pointer.wx), ty=Math.floor(pointer.wy);
    if(Math.hypot(tx+.5-player.x, ty+.5-player.y-player.h/2)<=REACH){
      ctx.strokeStyle="rgba(255,255,255,.35)"; ctx.lineWidth=2;
      ctx.strokeRect(tx*TILE-camX, ty*TILE-camY, TILE,TILE);
    }
  }
}

/* ---------- Đào & đặt ---------- */
const mining = {tile:null, prog:0, total:1};
function canReach(tx,ty){
  return Math.hypot(tx+.5-player.x, ty+.5-(player.y+player.h/2)) <= REACH;
}
function nearBlock(id){
  const r=4;
  for(let x=Math.floor(player.x)-r;x<=Math.floor(player.x)+r;x++)
    for(let y=Math.floor(player.y)-r;y<=Math.floor(player.y)+r;y++)
      if(getBlock(x,y)===id) return true;
  return false;
}
function tryMine(dt,tx,ty){
  const id=getBlock(tx,ty), b=BLOCKS[id];
  if(id===B.AIR||id===B.WATER||id===B.LAVA||id===B.BEDROCK){ mining.tile=null; mining.prog=0; return; }
  if(!mining.tile || mining.tile[0]!==tx || mining.tile[1]!==ty){
    mining.tile=[tx,ty]; mining.prog=0;
    const tier=heldTier();
    const speed = 1 + tier*1.7 + (tier>=b.tier?0.8:0);
    mining.total = b.hard / speed * (tier>=b.tier?1:2.4);
  }
  mining.prog += dt;
  if(mining.prog>=mining.total){
    if(heldTier()>=b.tier){
      let drop = b.drop;
      if(drop===-2) addItem(ORE_DROP[id],1);
      else if(drop>=0) addItem("b"+drop,1);
      if(id===B.LEAVES && Math.random()<0.12) addItem("apple",1);
    }
    spawnParticles(tx,ty,id,8);
    setBlock(tx,ty,B.AIR);
    mining.tile=null; mining.prog=0;
  }
}
function tryPlace(tx,ty){
  const s=held(); if(!s) return;
  const it=ITEMS[s.id]; if(!it.place) return;
  const cur=getBlock(tx,ty);
  if(cur!==B.AIR && cur!==B.WATER) return;
  // phải tựa vào khối khác
  if(!(isSolid(tx+1,ty)||isSolid(tx-1,ty)||isSolid(tx,ty+1)||isSolid(tx,ty-1)||
       getBlock(tx,ty+1)!==B.AIR)) return;
  // không đặt đè lên người chơi
  if(BLOCKS[it.place].solid &&
     tx+1>player.x-player.w/2 && tx<player.x+player.w/2 &&
     ty+1>player.y && ty<player.y+player.h) return;
  setBlock(tx,ty,it.place);
  s.count--; if(s.count<=0) inv[selSlot]=null;
  renderHotbar();
}
function tryAttack(wx,wy){
  if(player.atkCd>0) return false;
  for(const m of mobs){
    if(Math.abs(wx-m.x)<m.w/2+.5 && wy>m.y-.4 && wy<m.y+m.h+.4 && canReach(Math.floor(wx),Math.floor(wy))){
      m.hp -= heldDmg(); m.vx = Math.sign(m.x-player.x)*9; m.vy=-7; player.atkCd=.35;
      if(m.hp<=0 && m.type==="zombie" && Math.random()<.5) addItem("apple",1);
      return true;
    }
  }
  return false;
}

/* ---------- Điều khiển ---------- */
const keys={};
const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
const pointer = {down:false, wx:null, wy:null, place:false};
const touchMove = {left:false,right:false,jump:false};

addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyE"){ togglePanel("inv"); e.preventDefault(); }
  if(e.code.startsWith("Digit")){ const n=+e.code.slice(5); if(n>=1&&n<=9){ selSlot=n-1; renderHotbar(); } }
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup",e=>keys[e.code]=false);
addEventListener("wheel",e=>{ selSlot=(selSlot+(e.deltaY>0?1:8))%9; renderHotbar(); },{passive:true});
cv.addEventListener("contextmenu",e=>e.preventDefault());

function updPointer(e){
  const r=cv.getBoundingClientRect();
  pointer.wx = (e.clientX-r.left+camX)/TILE;
  pointer.wy = (e.clientY-r.top+camY)/TILE;
}
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  updPointer(e); pointer.down=true; pointer.place = (e.button===2);
  if(tryAttack(pointer.wx,pointer.wy)) { pointer.down=false; return; }
  const tx=Math.floor(pointer.wx), ty=Math.floor(pointer.wy);
  const solid = getBlock(tx,ty)!==B.AIR && getBlock(tx,ty)!==B.WATER;
  if((pointer.place || !solid) && canReach(tx,ty)) { tryPlace(tx,ty); pointer.down=false; }
});
cv.addEventListener("pointermove",e=>{ updPointer(e); });
cv.addEventListener("pointerup",e=>{ pointer.down=false; mining.tile=null; mining.prog=0; });
cv.addEventListener("pointercancel",()=>{ pointer.down=false; });

function bindHold(el,fn){
  el.tabIndex=-1;
  const on=e=>{e.preventDefault(); el.blur(); fn(true);}, off=e=>{e.preventDefault(); fn(false);};
  el.addEventListener("pointerdown",on); el.addEventListener("pointerup",off);
  el.addEventListener("pointerleave",off); el.addEventListener("pointercancel",off);
}
bindHold(document.getElementById("bLeft"), v=>touchMove.left=v);
bindHold(document.getElementById("bRight"), v=>touchMove.right=v);
bindHold(document.getElementById("jump"), v=>touchMove.jump=v);
if(!isTouch){ document.getElementById("pad").style.opacity=.55; document.getElementById("jump").style.opacity=.55; }

/* ---------- Giao diện ---------- */
function itemIcon(id,size){
  const c=document.createElement("canvas"); c.width=c.height=size;
  const g=c.getContext("2d"); g.imageSmoothingEnabled=false;
  const it=ITEMS[id]; if(!it) return c;
  if(it.kind==="block"){ g.drawImage(tex[it.place],0,0,size,size); return c; }
  g.fillStyle=it.c2; g.fillRect(size*0.45,size*0.25,size*0.1,size*0.62);
  g.fillStyle=it.c1;
  if(it.kind==="pick") g.fillRect(size*0.15,size*0.15,size*0.7,size*0.18);
  else if(it.kind==="sword"){ g.fillRect(size*0.42,size*0.1,size*0.16,size*0.55); g.fillStyle=it.c2; g.fillRect(size*0.28,size*0.6,size*0.44,size*0.08); }
  else if(it.kind==="stick"){ g.fillRect(size*0.42,size*0.15,size*0.16,size*0.7); }
  else { g.beginPath(); g.arc(size/2,size/2,size*0.3,0,7); g.fill(); }
  return c;
}
const hotbarEl=document.getElementById("hotbar");
function renderHotbar(){
  hotbarEl.innerHTML="";
  for(let i=0;i<9;i++){
    const d=document.createElement("div");
    d.className="slot"+(i===selSlot?" sel":"");
    const s=inv[i];
    if(s){ d.appendChild(itemIcon(s.id,28)); const n=document.createElement("span"); n.className="n"; n.textContent=s.count>1?s.count:""; d.appendChild(n); }
    d.addEventListener("pointerdown",e=>{e.preventDefault(); selSlot=i; renderHotbar();});
    hotbarEl.appendChild(d);
  }
}
const panel=document.getElementById("panel"), sheetInv=document.getElementById("sheetInv"), sheetNet=document.getElementById("sheetNet");
function togglePanel(which){
  const open = panel.classList.contains("on");
  const same = which==="inv" ? !sheetInv.classList.contains("hide") : !sheetNet.classList.contains("hide");
  if(open && same) closePanel(); else openPanel(which);
}
function openPanel(which){
  panel.classList.add("on");
  sheetInv.classList.toggle("hide", which!=="inv");
  sheetNet.classList.toggle("hide", which!=="net");
  if(which==="inv") renderInv();
}
function closePanel(){ panel.classList.remove("on"); }
function renderInv(){
  const g=document.getElementById("invGrid"); g.innerHTML="";
  for(let i=0;i<inv.length;i++){
    const d=document.createElement("div"); d.className="slot"; d.style.width="46px"; d.style.height="46px";
    const s=inv[i];
    if(s){ d.appendChild(itemIcon(s.id,28)); const n=document.createElement("span"); n.className="n"; n.textContent=s.count>1?s.count:""; d.appendChild(n); d.title=ITEMS[s.id].name; }
    d.addEventListener("click",()=>{ const t=inv[selSlot]; inv[selSlot]=inv[i]; inv[i]=t; renderInv(); renderHotbar(); });
    g.appendChild(d);
  }
  const hasTable=nearBlock(B.TABLE), hasFurnace=nearBlock(B.FURNACE);
  document.getElementById("craftHint").textContent =
    (hasTable?"Có bàn chế tạo gần đây. ":"Cần đứng cạnh bàn chế tạo cho công thức nâng cao. ")+
    (hasFurnace?"Có lò nung gần đây.":"Cần lò nung để nung quặng.");
  const list=document.getElementById("craftList"); list.innerHTML="";
  for(const r of RECIPES){
    const ok = Object.entries(r.need).every(([k,v])=>countItem(k)>=v)
      && (!r.table || hasTable) && (!r.furnace || hasFurnace);
    const row=document.createElement("div"); row.className="recipe"+(ok?"":" off");
    row.appendChild(itemIcon(r.out[0],30));
    const t=document.createElement("div"); t.className="txt";
    const needTxt=Object.entries(r.need).map(([k,v])=>ITEMS[k].name+" ×"+v+" ("+countItem(k)+")").join(", ");
    t.innerHTML="<b>"+ITEMS[r.out[0]].name+" ×"+r.out[1]+"</b><br><small>"+needTxt+(r.table?" · cần bàn":"")+(r.furnace?" · cần lò":"")+"</small>";
    row.appendChild(t);
    const b=document.createElement("button"); b.textContent="Chế"; b.disabled=!ok;
    b.addEventListener("click",()=>{
      for(const [k,v] of Object.entries(r.need)) takeItem(k,v);
      addItem(r.out[0],r.out[1]); renderInv(); renderHotbar(); toast("Đã chế "+ITEMS[r.out[0]].name);
    });
    row.appendChild(b);
    list.appendChild(row);
  }
}
let toastT=0;
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200);
}
document.getElementById("bInv").onclick=()=>openPanel("inv");
document.getElementById("bNet").onclick=()=>openPanel("net");
document.getElementById("bCloseInv").onclick=closePanel;
document.getElementById("bCloseNet").onclick=closePanel;
document.getElementById("bRespawn").onclick=()=>{
  player.x=player.spawnX; player.y=player.spawnY; player.vx=player.vy=0; player.hp=20; closePanel();
};
document.getElementById("bSave").onclick=()=>saveGame(true);

function updateHud(){
  let s="";
  const full=Math.floor(player.hp/2), half=player.hp%2;
  for(let i=0;i<10;i++) s += i<full?"♥":(i===full&&half?"♡":"·");
  document.getElementById("hearts").innerHTML='<span style="color:#e05252">'+s+'</span>';
  const hour=Math.floor(time*24), min=Math.floor((time*24%1)*60);
  document.getElementById("stat").textContent =
    "X "+Math.floor(player.x)+"  Y "+Math.floor(player.y)+"  "+String(hour).padStart(2,"0")+":"+String(min).padStart(2,"0")+
    "  "+["Rừng","Sa mạc","Tuyết"][biomeAt(Math.floor(player.x))];
}

/* ---------- Lưu ---------- */
async function store(key,val){
  try{ if(window.storage) { await window.storage.set(key,val); return true; } }catch(e){}
  try{ localStorage.setItem(key,val); return true; }catch(e){}
  return false;
}
async function load(key){
  try{ if(window.storage){ const r=await window.storage.get(key); return r?r.value:null; } }catch(e){}
  try{ return localStorage.getItem(key); }catch(e){}
  return null;
}
async function saveGame(manual){
  const data={seed:SEED, edits:[...edits], x:player.x, y:player.y, hp:player.hp, inv, time,
              sx:player.spawnX, sy:player.spawnY};
  const ok = await store("pixelcraft:save", JSON.stringify(data));
  if(manual) toast(ok?"Đã lưu thế giới":"Không lưu được trong môi trường này");
}
async function loadGame(){
  const raw = await load("pixelcraft:save");
  if(!raw) return false;
  try{
    const d=JSON.parse(raw);
    SEED=d.seed; applyEdits(d.edits);
    player.x=d.x; player.y=d.y; player.hp=d.hp; time=d.time||0.3;
    player.spawnX=d.sx??d.x; player.spawnY=d.sy??d.y;
    inv = d.inv.map(s=>s?{id:s.id,count:s.count}:null);
    while(inv.length<36) inv.push(null);
    return true;
  }catch(e){ return false; }
}
function applyEdits(list){
  edits=new Map(list); editsByChunk=new Map(); chunks=new Map(); topCache=new Map();
  for(const [k,v] of edits){
    const cx=chunkOf(+k.split(",")[0]);
    let m=editsByChunk.get(cx); if(!m){m=new Map();editsByChunk.set(cx,m);} m.set(k,v);
  }
}

/* ---------- Mạng (P2P qua PeerJS) ---------- */
const net = {
  peer:null, conns:[], host:false, joined:false, peers:{}, myName:"Player"+((Math.random()*90+10)|0),
  send(obj,except){
    const s=JSON.stringify(obj);
    for(const c of this.conns) if(c!==except && c.open) { try{c.send(s);}catch(e){} }
  },
  sendEdit(x,y,v){ if(this.peer) this.send({t:"edit",x,y,v}); },
  status(msg){ document.getElementById("netStatus").textContent=msg; },
  info(msg){ document.getElementById("netinfo").textContent=msg; }
};
function netId(){ return "pxc-"+Math.random().toString(36).slice(2,7); }
function setupConn(c){
  net.conns.push(c);
  c.on("open",()=>{
    if(net.host){
      c.send(JSON.stringify({t:"welcome",seed:SEED,edits:[...edits],time}));
    }
    c.send(JSON.stringify({t:"hi",name:net.myName}));
    net.info((net.host?"Chủ phòng · ":"Đã vào phòng · ")+(net.conns.length)+" kết nối");
  });
  c.on("data",raw=>{
    let m; try{ m=JSON.parse(raw); }catch(e){ return; }
    if(m.t==="welcome"){
      SEED=m.seed; applyEdits(m.edits); time=m.time;
      spawnPlayer(); net.status("Đã đồng bộ thế giới của chủ phòng.");
      toast("Đã vào thế giới chung");
    } else if(m.t==="edit"){
      setBlock(m.x,m.y,m.v,true);
      if(net.host) net.send(m,c);
    } else if(m.t==="pos"){
      const p=net.peers[c.peer]||(net.peers[c.peer]={w:.68,h:1.78,anim:0,dir:1});
      p.x=m.x; p.y=m.y; p.dir=m.d; p.name=m.n; p.anim=m.a;
      if(net.host) net.send(m,c);
    } else if(m.t==="hi"){
      const p=net.peers[c.peer]||(net.peers[c.peer]={w:.68,h:1.78,anim:0,dir:1});
      p.name=m.name; toast(m.name+" đã tham gia");
    }
  });
  c.on("close",()=>{
    net.conns=net.conns.filter(x=>x!==c); delete net.peers[c.peer];
    net.info(net.conns.length?((net.host?"Chủ phòng · ":"Đã vào phòng · ")+net.conns.length+" kết nối"):"Một mình");
  });
  c.on("error",()=>{});
}
document.getElementById("bHost").onclick=()=>{
  if(typeof Peer==="undefined"){ net.status("Không tải được thư viện mạng. Hãy kiểm tra kết nối Internet."); return; }
  net.myName = document.getElementById("nameIn").value.trim() || net.myName;
  const id=netId();
  net.peer = new Peer(id);
  net.host = true;
  net.peer.on("open",()=>{ net.status("Mã phòng: "+id+" — gửi mã này cho bạn bè."); net.info("Chủ phòng · 0 kết nối"); });
  net.peer.on("connection",setupConn);
  net.peer.on("error",e=>net.status("Lỗi mạng: "+e.type));
};
document.getElementById("bJoin").onclick=()=>{
  if(typeof Peer==="undefined"){ net.status("Không tải được thư viện mạng. Hãy kiểm tra kết nối Internet."); return; }
  const room=document.getElementById("roomIn").value.trim();
  if(!room){ net.status("Nhập mã phòng trước đã."); return; }
  net.myName = document.getElementById("nameIn").value.trim() || net.myName;
  net.peer = new Peer();
  net.peer.on("open",()=>{
    net.status("Đang kết nối tới "+room+"…");
    const c=net.peer.connect(room,{reliable:true});
    setupConn(c);
  });
  net.peer.on("error",e=>net.status("Lỗi mạng: "+e.type+" — kiểm tra lại mã phòng."));
};
let posTimer=0;
function netTick(dt){
  if(!net.peer||!net.conns.length) return;
  posTimer+=dt;
  if(posTimer>0.07){
    posTimer=0;
    net.send({t:"pos",x:+player.x.toFixed(2),y:+player.y.toFixed(2),d:player.dir,n:net.myName,a:+player.anim.toFixed(1)});
  }
}

/* ---------- Vòng lặp ---------- */
let last=performance.now(), acc=0, saveTimer=0;
function update(dt){
  // di chuyển
  const left = keys.KeyA||keys.ArrowLeft||touchMove.left;
  const right= keys.KeyD||keys.ArrowRight||touchMove.right;
  const jump = keys.KeyW||keys.ArrowUp||keys.Space||touchMove.jump;
  const liquid = inLiquid(player);
  const speed = liquid?4.4:6.4;
  if(player.hp>0){
    if(left){ player.vx=-speed; player.dir=-1; player.anim+=dt*11; }
    else if(right){ player.vx=speed; player.dir=1; player.anim+=dt*11; }
    else { player.vx*=0.72; player.anim*=0.9; }
    if(jump){
      if(liquid) player.vy = -5.5;
      else if(player.onGround) player.vy = -14.2;
    }
  } else { player.vx*=0.8; }
  if(liquid){ player.vy = Math.min(player.vy, 5); player.vy*=0.92; }
  if(liquid===2 && player.invul<=0) hurtPlayer(3);
  physics(player,dt);

  player.hurt=Math.max(0,player.hurt-dt*3);
  player.invul=Math.max(0,player.invul-dt);
  player.atkCd=Math.max(0,player.atkCd-dt);

  // đào giữ tay
  if(pointer.down && player.hp>0 && pointer.wx!==null){
    const tx=Math.floor(pointer.wx), ty=Math.floor(pointer.wy);
    if(canReach(tx,ty)) tryMine(dt,tx,ty); else { mining.tile=null; mining.prog=0; }
  } else if(!pointer.down){ mining.prog=Math.max(0,mining.prog-dt*2); }

  updateMobs(dt);
  spawnMobs(dt);
  updateParticles(dt);
  time = (time + dt/DAY_LEN) % 1;

  // máy quay
  const tX = player.x*TILE - VW/2, tY = player.y*TILE - VH/2;
  camX += (tX-camX)*Math.min(1,dt*9);
  camY += (tY-camY)*Math.min(1,dt*9);
  camY = Math.max(-TILE*4, Math.min(WORLD_H*TILE-VH+TILE*2, camY));

  netTick(dt);
  saveTimer+=dt; if(saveTimer>30){ saveTimer=0; saveGame(false); }
}
function frame(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  update(dt);
  render();
  updateHud();
  requestAnimationFrame(frame);
}

/* ---------- Khởi động ---------- */
(async function start(){
  resize();
  buildTextures();
  const loaded = await loadGame();
  if(!loaded){
    spawnPlayer();
    addItem("b"+B.TORCH,8);
  }
  document.getElementById("nameIn").value = net.myName;
  renderHotbar();
  toast(loaded?"Đã tải lại thế giới cũ":"Thế giới mới — hạt giống "+SEED);
  requestAnimationFrame(frame);
})();
</script>
